name: tests
on:
  push:
    branches: [poker-core, master]
  pull_request:
jobs:
  trainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The trainer + engine need only these; the heavy optional deps (LLM SDKs, PDF tools, Kaggle env) are skipped.
      - run: pip install treys phevaluator numpy fastapi pydantic httpx httpx2
      - run: python -m tests.test_browser_bridge
      - run: python -m tests.test_prefold
      - run: python -m tests.test_tournament_mode
      - run: python -m tests.test_table
      - run: python -m tests.test_icm
      - run: python web/build.py
